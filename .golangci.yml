version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - unconvert
    - unparam
  settings:
    depguard:
      rules:
        main:
          list-mode: lax
          deny:
            - pkg: "math/rand"
              desc: "use crypto/rand"
            - pkg: "log/slog"
              desc: "nolog (see AGENTS.md)"
    forbidigo:
      forbid:
        - pattern: '^(fmt\.Print.*|print|println)$'
          msg: "nolog: no output outside cmd/fugace (see AGENTS.md)"
        - pattern: '^log\..*$'
          msg: "nolog: no logging (see AGENTS.md)"
        - pattern: '^slog\..*$'
          msg: "nolog: no logging (see AGENTS.md)"
        - pattern: '^os\.(Create|CreateTemp|MkdirTemp|WriteFile|OpenFile|TempDir)$'
          msg: "no disk writes at runtime (see ARCHITECTURE §5)"
        - pattern: '^.*\.ParseMultipartForm$'
          msg: "spills to disk; read the raw body with MaxBytesReader instead"
  exclusions:
    rules:
      - path: cmd/fugace/
        linters: [forbidigo, depguard]
      # Only place allowed to write to disk, and only when FUGACE_CERT_CACHE is set.
      - path: internal/tlsmgr/cache\.go
        linters: [forbidigo]
      - path: _test\.go
        linters: [forbidigo, gosec]

formatters:
  enable:
    - gofumpt
    - goimports
