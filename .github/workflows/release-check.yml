name: release-check

# Checks a published release: signature, then each architecture runs from
# the registry, then the GitHub release is created if it does not exist.
# Called by release.yml after publishing; can be re-run by hand for a tag.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Resolve the published digest
        run: |
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag"; exit 1 ;; esac
          digest=$(docker buildx imagetools inspect "${IMAGE}:${TAG#v}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Verify the signature
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
      - name: Smoke-test amd64 and arm64 from the registry
        run: |
          for p in linux/amd64 linux/arm64; do
            echo "== $p"
            # The classic image store keeps one platform per digest.
            docker image rm -f "${IMAGE}@${DIGEST}" >/dev/null 2>&1 || true
            SMOKE_PLATFORM=$p SMOKE_IRC=1 SMOKE_TLS=1 ./scripts/smoke.sh "${IMAGE}@${DIGEST}"
          done
      - name: GitHub release from the changelog, with the installer attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum install.sh > install.sh.sha256
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists: refreshing the installer assets"
            gh release upload "$TAG" install.sh install.sh.sha256 --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          v="${TAG#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          printf '\nImage : `%s@%s` (amd64, arm64), signée cosign, SBOM et provenance attachés.\n' "$IMAGE" "$DIGEST" >> notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "fugace $TAG" --notes-file notes.md --verify-tag \
            install.sh install.sh.sha256
