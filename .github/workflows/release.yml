name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Every action is pinned to a full commit SHA (tag in the trailing comment).
jobs:
  # Nothing is published unless the tagged commit passes again.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race -count=1 ./...
      - run: ./scripts/check-supply-chain.sh
      - run: ./scripts/check-compose.sh
      - name: Build and smoke-test the amd64 image
        run: |
          docker build --build-arg VERSION="$GITHUB_REF_NAME" -t fugace:release .
          SMOKE_IRC=1 SMOKE_TLS=1 ./scripts/smoke.sh fugace:release
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fugace:release
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # push to GHCR
      id-token: write      # keyless cosign signature
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  # The published image itself: signature, then each architecture runs.
  check:
    needs: image
    permissions:
      contents: write      # create the GitHub release
      packages: read
    uses: ./.github/workflows/release-check.yml
    with:
      tag: ${{ github.ref_name }}
