name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA (tag in the trailing comment).
jobs:
  guard:
    name: repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No tool attribution in files or commit messages
        run: |
          # Bracketed letters keep this file from matching its own pattern.
          pat='cl[a]ude|anthr[o]pic|co-author[e]d-by|gener[a]ted with'
          if git grep -nIiE "$pat" -- . ; then
            echo "::error::forbidden mention found in tracked files"; exit 1
          fi
          if git log --format='%H%n%B' | grep -niE "$pat"; then
            echo "::error::forbidden mention found in commit messages"; exit 1
          fi
      - name: No dangerous DOM sinks in the web client
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write|eval\(' web/static 2>/dev/null; then
            echo "::error::forbidden DOM sink"; exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race -count=1 ./...
      - name: Short fuzzing pass
        run: make fuzz FUZZTIME=15s

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make vuln

  image:
    needs: [guard, lint, test, vuln]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fugace:ci
          build-args: VERSION=${{ github.sha }}
      - name: Image size budget (< 20 MB)
        run: |
          size=$(docker image inspect fugace:ci --format '{{.Size}}')
          echo "image size: $size bytes"
          test "$size" -lt 20971520
      - name: Smoke test
        # set SMOKE_IRC=1 from M1, SMOKE_TLS=1 from M3
        run: SMOKE_IRC=0 SMOKE_TLS=0 ./scripts/smoke.sh fugace:ci
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fugace:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
