name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Security issues must not be reported here**, see SECURITY.md.
        Please never paste passwords, tokens or other people's messages.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `docker exec fugace /fugace version`, or the image tag/digest.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web client, IRC (native clients), HTTPS / certificates, Files and images, Deployment / container, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Configuration (FUGACE_* variables, without secrets), client used, commands.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of `fugace status` (optional)
      render: text
